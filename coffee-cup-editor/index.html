<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>Coffee Cup Editor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #d9d9d6; overflow: hidden; font-family: system-ui, sans-serif; color: #fff; }
  #app { width: 100vw; height: 100vh; }
  canvas { display: block; }

  #ui {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    background: rgba(20,20,22,0.58); backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 16px;
    padding: 13px 22px; z-index: 10;
  }
  #toolName {
    color: #fff; font-size: 17px; font-weight: 700;
    letter-spacing: 0.08em; width: 210px; white-space: nowrap;
  }
  .sep { width: 1px; height: 20px; background: rgba(255,255,255,0.16); flex-shrink: 0; }
  .mode-label {
    color: rgba(255,255,255,0.58); font-size: 12px;
    letter-spacing: 0.04em; padding: 4px 2px; white-space: nowrap;
  }
  .upload-spec {
    color: rgba(255,255,255,0.38); font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
  }

  button {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px; color: rgba(255,255,255,0.72); font-size: 11px;
    letter-spacing: 0.05em; padding: 6px 13px; cursor: pointer; white-space: nowrap;
    transition: all 0.15s;
  }
  button:hover { background: rgba(255,255,255,0.13); color: #fff; }
  .icon-btn {
    width: 28px; height: 28px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; line-height: 1;
  }
  .export-wrap { position: relative; }
  #exportBtn::after { content: " v"; color: rgba(255,255,255,0.42); }
  .export-menu {
    position: absolute; right: 0; bottom: 40px; width: 230px;
    display: none; flex-direction: column; gap: 8px;
    background: rgba(14,14,18,0.92); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 14px;
    padding: 12px; box-shadow: 0 18px 44px rgba(0,0,0,0.35);
  }
  .export-wrap.open .export-menu { display: flex; }
  .export-title {
    color: rgba(255,255,255,0.38); font-size: 10px;
    letter-spacing: 0.11em; text-transform: uppercase;
  }
  .export-row {
    display: grid; grid-template-columns: 44px 1fr 1fr 1fr; gap: 6px;
    align-items: center;
  }
  .export-format {
    color: rgba(255,255,255,0.68); font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .export-option {
    padding: 7px 6px; text-align: center; font-size: 10px;
  }
  .export-option.disabled {
    opacity: 0.3; cursor: not-allowed; pointer-events: none;
  }
  .export-3d {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    padding: 9px 10px; font-size: 11px; text-align: left;
  }
  .export-3d span { color: rgba(255,255,255,0.42); font-size: 10px; }
  .export-toggles {
    display: flex; flex-direction: column; gap: 7px;
    padding: 2px 0 4px; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .export-toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    color: rgba(255,255,255,0.56); font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .export-toggle input { width: 14px; height: 14px; accent-color: #fff; cursor: pointer; }
  #wrapFile { display: none; }

  #panel {
    position: fixed; right: 22px; top: 50%; transform: translateY(-50%);
    background: rgba(10,10,14,0.76); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
    padding: 20px 18px; width: 184px; z-index: 10;
    display: flex; flex-direction: column; gap: 14px;
  }
  .ctrl-row { display: flex; flex-direction: column; gap: 7px; }
  .ctrl-label {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(255,255,255,0.34);
  }
  .ctrl-label span { color: rgba(255,255,255,0.58); font-variant-numeric: tabular-nums; }
  input[type="range"] {
    -webkit-appearance: none; width: 100%; height: 2px;
    background: rgba(255,255,255,0.15); border-radius: 2px; outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: #fff; cursor: pointer;
    box-shadow: 0 0 5px rgba(255,255,255,0.35);
  }
  .color-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .color-row input[type="color"] {
    -webkit-appearance: none; appearance: none;
    width: 32px; height: 22px; padding: 0;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 7px;
    background: transparent; cursor: pointer; overflow: hidden;
  }
  .color-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .color-row input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 6px; }
  .model-options { display: flex; flex-direction: column; gap: 5px; }
  .model-btn {
    width: 100%; padding: 8px 12px; text-align: left;
    color: rgba(255,255,255,0.48);
  }
  .model-btn.active {
    border-color: rgba(255,255,255,0.26);
    background: rgba(255,255,255,0.1);
    color: #fff;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #d9d9d6; color: rgba(0,0,0,0.32); font-size: 11px;
    letter-spacing: 0.2em; text-transform: uppercase; z-index: 100; transition: opacity 0.4s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #hint {
    position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
    color: rgba(0,0,0,0.24); font-size: 10px; letter-spacing: 0.13em;
    text-transform: uppercase; pointer-events: none; user-select: none;
  }
  @media (max-width: 780px) {
    #panel { width: 164px; right: 12px; }
    #ui { max-width: calc(100vw - 24px); overflow-x: auto; }
    #toolName { width: 170px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="loading">Loading Cup</div>
  <div id="hint">Drag to orbit - right drag to pan - scroll to zoom</div>

  <div id="ui">
    <div id="toolName">Coffee Cup Editor</div>
    <div class="sep"></div>
    <div class="mode-label">Cup Sleeve</div>
    <div id="uploadSpec" class="upload-spec">1800 x 900 px</div>
    <div class="sep"></div>
    <button id="uploadWrapBtn" type="button">Upload Design</button>
    <button id="clearWrapBtn" class="icon-btn" type="button" aria-label="Remove design" title="Remove design">X</button>
    <input type="file" id="wrapFile" accept="image/*">
    <div class="sep"></div>
    <button id="resetBtn" type="button">Reset View</button>
    <div id="exportWrap" class="export-wrap">
      <button id="exportBtn" type="button" aria-haspopup="true" aria-expanded="false">Export</button>
      <div id="exportMenu" class="export-menu" role="menu">
        <div class="export-title">Export Quality</div>
        <div class="export-toggles">
          <label class="export-toggle" for="transparentExport">Transparent PNG <input id="transparentExport" type="checkbox"></label>
          <label class="export-toggle" for="shadowExport">Hide Shadow <input id="shadowExport" type="checkbox"></label>
        </div>
        <div class="export-row">
          <div class="export-format">PNG</div>
          <button class="export-option" type="button" data-format="png" data-height="720" data-fxkits-export>720P</button>
          <button class="export-option" type="button" data-format="png" data-height="1080" data-fxkits-export>1080P</button>
          <button class="export-option disabled" type="button" disabled>4K</button>
        </div>
        <div class="export-row">
          <div class="export-format">JPG</div>
          <button class="export-option" type="button" data-format="jpg" data-height="720" data-fxkits-export>720P</button>
          <button class="export-option" type="button" data-format="jpg" data-height="1080" data-fxkits-export>1080P</button>
          <button class="export-option disabled" type="button" disabled>4K</button>
        </div>
        <button id="export3dBtn" class="export-3d" type="button" data-fxkits-export>3D File <span>GLB</span></button>
      </div>
    </div>
  </div>

  <div id="panel">
    <div class="ctrl-row">
      <div class="ctrl-label">Paper <span id="paperVal">0.86</span></div>
      <input type="range" id="paper" min="0" max="1" step="0.01" value="0.86">
    </div>
    <div class="ctrl-row">
      <div class="ctrl-label">Roughness <span id="roughnessVal">0.42</span></div>
      <input type="range" id="roughness" min="0.12" max="0.9" step="0.01" value="0.42">
    </div>
    <div class="ctrl-row">
      <div class="ctrl-label">Shine <span id="shineVal">0.34</span></div>
      <input type="range" id="shine" min="0" max="1.4" step="0.01" value="0.34">
    </div>
    <div class="ctrl-row">
      <div class="ctrl-label">Sleeve Gloss <span id="labelGlossVal">0.28</span></div>
      <input type="range" id="labelGloss" min="0" max="1" step="0.01" value="0.28">
    </div>
    <div class="ctrl-row">
      <div class="ctrl-label">Tilt <span id="tiltVal">0.00</span></div>
      <input type="range" id="tilt" min="-0.45" max="0.45" step="0.01" value="0">
    </div>
    <div class="color-row">
      <div class="ctrl-label">Background</div>
      <input type="color" id="bgColor" value="#d9d9d6" aria-label="Background color">
    </div>
    <div class="color-row">
      <div class="ctrl-label">Cup Color</div>
      <input type="color" id="cupColor" value="#4d4b47" aria-label="Cup color">
    </div>
    <div class="color-row">
      <div class="ctrl-label">Lid Color</div>
      <input type="color" id="lidColor" value="#1c1c17" aria-label="Lid color">
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js'

const $ = id => document.getElementById(id)
const app = $('app')

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
renderer.setSize(innerWidth, innerHeight)
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.05
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
app.prepend(renderer.domElement)

const scene = new THREE.Scene()
scene.background = new THREE.Color(0xd9d9d6)
document.body.style.backgroundColor = '#d9d9d6'

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.05, 100)
camera.position.set(0, 0.55, 7.2)

const controls = new OrbitControls(camera, renderer.domElement)
controls.enableDamping = true
controls.dampingFactor = 0.055
controls.minDistance = 2.2
controls.maxDistance = 12
controls.target.set(0, 0, 0)

const root = new THREE.Group()
scene.add(root)

function buildStudioEnv() {
  const w = 2048, h = 1024
  const cv = document.createElement('canvas')
  cv.width = w; cv.height = h
  const cx = cv.getContext('2d')
  cx.fillStyle = '#d5d5d2'
  cx.fillRect(0, 0, w, h)
  const grad = cx.createLinearGradient(0, 0, 0, h)
  grad.addColorStop(0, '#f7f7f2')
  grad.addColorStop(0.48, '#dcdcd8')
  grad.addColorStop(1, '#a9aaa6')
  cx.fillStyle = grad
  cx.fillRect(0, 0, w, h)
  const addPanel = (x, y, pw, ph, alpha) => {
    cx.save()
    cx.shadowBlur = 150
    cx.shadowColor = `rgba(255,255,255,${alpha})`
    cx.fillStyle = `rgba(255,255,255,${alpha})`
    cx.fillRect(x, y, pw, ph)
    cx.restore()
  }
  addPanel(w * 0.06, h * 0.08, w * 0.22, h * 0.42, 0.95)
  addPanel(w * 0.73, h * 0.10, w * 0.20, h * 0.38, 0.8)
  addPanel(w * 0.38, h * 0.02, w * 0.24, h * 0.08, 0.68)
  cx.fillStyle = 'rgba(20,20,18,0.18)'
  cx.fillRect(0, h * 0.58, w, h * 0.42)
  return cv
}

const pmrem = new THREE.PMREMGenerator(renderer)
const envTexture = new THREE.CanvasTexture(buildStudioEnv())
envTexture.mapping = THREE.EquirectangularReflectionMapping
scene.environment = pmrem.fromEquirectangular(envTexture).texture
envTexture.dispose()
pmrem.dispose()

const hemi = new THREE.HemisphereLight(0xffffff, 0xb6b6b0, 1.5)
scene.add(hemi)
const key = new THREE.DirectionalLight(0xffffff, 2.6)
key.position.set(-3, 4.5, 3.5)
key.castShadow = true
key.shadow.mapSize.set(2048, 2048)
scene.add(key)
const rim = new THREE.DirectionalLight(0xffffff, 1.5)
rim.position.set(4, 3, -4)
scene.add(rim)

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(18, 18),
  new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.13 })
)
floor.rotation.x = -Math.PI / 2
floor.position.y = -2.18
floor.receiveShadow = true
scene.add(floor)

const cupMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x4d4b47,
  metalness: 0,
  roughness: 0.42,
  envMapIntensity: 0.34,
  clearcoat: 0.18,
  clearcoatRoughness: 0.3,
})

const lidMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x1c1c17,
  metalness: 0,
  roughness: 0.38,
  envMapIntensity: 0.42,
  clearcoat: 0.2,
  clearcoatRoughness: 0.24,
})

const labelMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0,
  roughness: 0.46,
  envMapIntensity: 0.8,
  clearcoat: 0.28,
  clearcoatRoughness: 0.24,
  side: THREE.DoubleSide,
  depthTest: true,
  depthWrite: true,
})

let cupObject = null
let cupHeight = 4
let cupRadius = 1
const cupCenter = new THREE.Vector3()
let wrapImage = null
let useDefaultArtwork = true
let labelCanvas = null
let labelTexture = null
const labelWidth = 1800
const labelHeight = 900
const MODEL_URL = 'assets/model/scene.gltf'

function makeDefaultLabelCanvas() {
  const cv = document.createElement('canvas')
  cv.width = labelWidth; cv.height = labelHeight
  const cx = cv.getContext('2d')
  cx.fillStyle = '#f3ede3'
  cx.fillRect(0, 0, cv.width, cv.height)
  const grad = cx.createLinearGradient(0, 0, cv.width, cv.height)
  grad.addColorStop(0, '#fff7ec')
  grad.addColorStop(0.48, '#d7a66a')
  grad.addColorStop(1, '#2b1b13')
  cx.fillStyle = grad
  cx.fillRect(0, 0, cv.width, cv.height)
  cx.fillStyle = 'rgba(255,255,255,0.88)'
  cx.fillRect(cv.width * 0.09, cv.height * 0.16, cv.width * 0.82, cv.height * 0.68)
  cx.fillStyle = '#1c1714'
  cx.font = '800 132px system-ui, sans-serif'
  cx.textAlign = 'center'
  cx.fillText('ROAST HOUSE', cv.width / 2, cv.height * 0.46)
  cx.font = '500 42px system-ui, sans-serif'
  cx.letterSpacing = '8px'
  cx.fillText('SPECIALTY COFFEE', cv.width / 2, cv.height * 0.59)
  cx.strokeStyle = 'rgba(28,23,20,0.22)'
  cx.lineWidth = 6
  cx.strokeRect(cv.width * 0.12, cv.height * 0.2, cv.width * 0.76, cv.height * 0.6)
  return cv
}

function drawContain(cx, image, x, y, w, h) {
  const ratio = Math.min(w / image.width, h / image.height)
  const dw = image.width * ratio
  const dh = image.height * ratio
  cx.drawImage(image, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh)
}

function drawCover(cx, image, x, y, w, h) {
  const ratio = Math.max(w / image.width, h / image.height)
  const dw = image.width * ratio
  const dh = image.height * ratio
  cx.drawImage(image, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh)
}

function drawSmartFit(cx, image, x, y, w, h) {
  const maxW = w * 0.34
  const maxH = h * 0.58
  const ratio = Math.min(maxW / image.width, maxH / image.height)
  const dw = image.width * ratio
  const dh = image.height * ratio
  cx.drawImage(image, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh)
}

function rebuildLabelTexture() {
  if (!labelCanvas) labelCanvas = makeDefaultLabelCanvas()
  const cx = labelCanvas.getContext('2d')
  cx.fillStyle = '#ffffff'
  cx.fillRect(0, 0, labelCanvas.width, labelCanvas.height)

  if (wrapImage) drawSmartFit(cx, wrapImage, 0, 0, labelCanvas.width, labelCanvas.height)
  if (!wrapImage && useDefaultArtwork) {
    const fallback = makeDefaultLabelCanvas()
    cx.drawImage(fallback, 0, 0)
  }

  if (!labelTexture) {
    labelTexture = new THREE.CanvasTexture(labelCanvas)
    labelTexture.colorSpace = THREE.SRGBColorSpace
    labelTexture.wrapS = THREE.RepeatWrapping
    labelTexture.wrapT = THREE.ClampToEdgeWrapping
    labelTexture.anisotropy = renderer.capabilities.getMaxAnisotropy()
  }
  labelMaterial.map = labelTexture
  labelTexture.needsUpdate = true
  labelMaterial.needsUpdate = true
}

function frameCup(scaledBox, scaledSize) {
  const radius = Math.max(scaledSize.x, scaledSize.z) * 0.5
  const distance = Math.max(6.4, cupHeight * 1.28, radius * 4.6)
  floor.position.y = scaledBox.min.y - 0.025
  controls.target.copy(cupCenter)
  camera.position.set(cupCenter.x, cupCenter.y + cupHeight * 0.08, cupCenter.z + distance)
  controls.update()
}

function normalizeCup(object) {
  const box = new THREE.Box3().setFromObject(object)
  const size = box.getSize(new THREE.Vector3())
  const center = box.getCenter(new THREE.Vector3())
  const scale = 4.4 / size.y
  object.position.sub(center)
  object.scale.setScalar(scale)
  const scaledBox = new THREE.Box3().setFromObject(object)
  const scaledSize = scaledBox.getSize(new THREE.Vector3())
  cupHeight = scaledSize.y
  cupRadius = Math.max(scaledSize.x, scaledSize.z) * 0.5
  scaledBox.getCenter(cupCenter)
  frameCup(scaledBox, scaledSize)
}

function prepareSleeveGeometry(mesh) {
  const source = mesh.geometry.index ? mesh.geometry.toNonIndexed() : mesh.geometry.clone()
  source.computeBoundingBox()
  const box = source.boundingBox
  const positions = source.attributes.position
  const uvs = new Float32Array(positions.count * 2)
  const height = Math.max(0.0001, box.max.y - box.min.y)
  const triU = [0, 0, 0]
  const triV = [0, 0, 0]

  for (let i = 0; i < positions.count; i += 3) {
    for (let j = 0; j < 3; j++) {
      const index = i + j
      const x = positions.getX(index)
      const y = positions.getY(index)
      const z = positions.getZ(index)
      const angle = Math.atan2(z, x)
      triU[j] = 1 - ((angle + Math.PI) / (Math.PI * 2))
      triV[j] = (y - box.min.y) / height
    }

    const minU = Math.min(triU[0], triU[1], triU[2])
    const maxU = Math.max(triU[0], triU[1], triU[2])
    if (maxU - minU > 0.5) {
      for (let j = 0; j < 3; j++) {
        if (triU[j] < 0.5) triU[j] += 1
      }
    }

    for (let j = 0; j < 3; j++) {
      const index = i + j
      uvs[index * 2] = triU[j]
      uvs[index * 2 + 1] = triV[j]
    }
  }

  source.setAttribute('uv', new THREE.BufferAttribute(uvs, 2))
  if (!source.attributes.normal) source.computeVertexNormals()
  mesh.geometry.dispose()
  mesh.geometry = source
}

function disposeSceneObject(object) {
  object.traverse(child => {
    if (child.geometry) child.geometry.dispose()
  })
}

function loadCup() {
  $('loading').textContent = 'Loading Cup'
  $('loading').classList.remove('hidden')
  new GLTFLoader().load(
    MODEL_URL,
    gltf => {
      const object = gltf.scene
      cupObject = object
      object.traverse(child => {
        if (!child.isMesh) return
        const materialName = child.material?.name?.toLowerCase() || ''
        const meshName = child.name.toLowerCase()
        const isSleeve = materialName.includes('sleeve') || meshName.includes('sleeve')
        const isLid = materialName.includes('material_1') || meshName.includes('lid')
        if (isSleeve) prepareSleeveGeometry(child)
        child.material = isSleeve ? labelMaterial : (isLid ? lidMaterial : cupMaterial)
        child.castShadow = true
        child.receiveShadow = true
        if (!child.geometry.attributes.normal) child.geometry.computeVertexNormals()
      })
      normalizeCup(object)
      root.add(object)
      rebuildLabelTexture()
      $('loading').classList.add('hidden')
    },
    undefined,
    error => {
      console.error(error)
      $('loading').textContent = 'Model failed'
    }
  )
}

function bindSlider(id, valueId, decimals, apply) {
  const input = $(id)
  const output = $(valueId)
  input.addEventListener('input', () => {
    const v = Number(input.value)
    output.textContent = v.toFixed(decimals)
    apply(v)
  })
}

bindSlider('paper', 'paperVal', 2, v => {
  cupMaterial.clearcoat = v * 0.24
  cupMaterial.envMapIntensity = 0.12 + v * 0.42
})
bindSlider('roughness', 'roughnessVal', 2, v => {
  cupMaterial.roughness = v
  lidMaterial.roughness = v
})
bindSlider('shine', 'shineVal', 2, v => {
  lidMaterial.envMapIntensity = v
  lidMaterial.clearcoat = Math.min(1, v / 1.4)
  cupMaterial.envMapIntensity = v * 0.72
})
bindSlider('labelGloss', 'labelGlossVal', 2, v => {
  labelMaterial.clearcoat = v
  labelMaterial.roughness = 0.58 - v * 0.42
})
bindSlider('tilt', 'tiltVal', 2, v => { root.rotation.z = v })

function setSlider(id, value, decimals) {
  $(id).value = value
  $(`${id}Val`).textContent = Number(value).toFixed(decimals)
}

function setSceneBackground(hex) {
  scene.background.set(hex)
  document.body.style.backgroundColor = hex
  $('loading').style.background = hex
  $('bgColor').value = hex
}

$('bgColor').addEventListener('input', e => setSceneBackground(e.target.value))
$('cupColor').addEventListener('input', e => cupMaterial.color.set(e.target.value))
$('lidColor').addEventListener('input', e => lidMaterial.color.set(e.target.value))

function readImage(file, assign) {
  if (!file) return
  const img = new Image()
  img.onload = () => {
    assign(img)
    rebuildLabelTexture()
  }
  img.src = URL.createObjectURL(file)
}

$('uploadWrapBtn').addEventListener('click', () => $('wrapFile').click())
$('wrapFile').addEventListener('change', e => readImage(e.target.files[0], img => {
  useDefaultArtwork = false
  wrapImage = img
}))
$('clearWrapBtn').addEventListener('click', () => {
  useDefaultArtwork = false
  wrapImage = null
  $('wrapFile').value = ''
  rebuildLabelTexture()
})

$('resetBtn').addEventListener('click', () => {
  root.rotation.set(0, 0, 0)
  setSlider('tilt', 0, 2)
  const distance = Math.max(6.4, cupHeight * 1.28, cupRadius * 4.6)
  camera.position.set(cupCenter.x, cupCenter.y + cupHeight * 0.08, cupCenter.z + distance)
  controls.target.copy(cupCenter)
  controls.update()
})

function downloadUrl(url, filename) {
  const a = document.createElement('a')
  a.href = url
  a.download = filename
  document.body.appendChild(a)
  a.click()
  document.body.removeChild(a)
}

function closeExportMenu() {
  $('exportWrap').classList.remove('open')
  $('exportBtn').setAttribute('aria-expanded', 'false')
}

function exportImage(format, targetHeight) {
  const originalPixelRatio = renderer.getPixelRatio()
  const originalSize = renderer.getSize(new THREE.Vector2())
  const originalBackground = scene.background
  const originalFloorVisible = floor.visible
  const aspect = innerWidth / innerHeight
  const width = Math.round(targetHeight * aspect)
  const mime = format === 'jpg' ? 'image/jpeg' : 'image/png'
  const ext = format === 'jpg' ? 'jpg' : 'png'
  const useTransparentBackground = format === 'png' && $('transparentExport').checked

  if (useTransparentBackground) scene.background = null
  if ($('shadowExport').checked) floor.visible = false
  renderer.setPixelRatio(1)
  renderer.setSize(width, targetHeight, false)
  renderer.render(scene, camera)
  downloadUrl(renderer.domElement.toDataURL(mime, 0.92), `coffee-cup-editor-${targetHeight}p.${ext}`)
  scene.background = originalBackground
  floor.visible = originalFloorVisible
  renderer.setPixelRatio(originalPixelRatio)
  renderer.setSize(originalSize.x, originalSize.y, false)
  renderer.render(scene, camera)
}

function exportGlb() {
  const exporter = new GLTFExporter()
  exporter.parse(
    root,
    result => {
      const blob = result instanceof ArrayBuffer
        ? new Blob([result], { type: 'model/gltf-binary' })
        : new Blob([JSON.stringify(result)], { type: 'model/gltf+json' })
      const url = URL.createObjectURL(blob)
      downloadUrl(url, result instanceof ArrayBuffer ? 'coffee-cup-editor.glb' : 'coffee-cup-editor.gltf')
      URL.revokeObjectURL(url)
    },
    error => console.error(error),
    { binary: true, embedImages: true, trs: false }
  )
}

$('exportBtn').addEventListener('click', event => {
  event.stopPropagation()
  const isOpen = $('exportWrap').classList.toggle('open')
  $('exportBtn').setAttribute('aria-expanded', String(isOpen))
})

document.querySelectorAll('.export-option[data-format]').forEach(btn => {
  btn.addEventListener('click', () => {
    exportImage(btn.dataset.format, Number(btn.dataset.height))
    closeExportMenu()
  })
})

$('export3dBtn').addEventListener('click', () => {
  exportGlb()
  closeExportMenu()
})

document.addEventListener('click', event => {
  if (!$('exportWrap').contains(event.target)) closeExportMenu()
})

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight)
})

function animate() {
  requestAnimationFrame(animate)
  controls.update()
  renderer.render(scene, camera)
}

loadCup()
animate()
</script>
<script src="/gate.js?v=3" defer></script>
</body>
</html>

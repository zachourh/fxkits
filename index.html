<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FXKits — Visual Effect Tools for Designers</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 24px 80px;
}

/* Logo */
.logo {
  margin-bottom: 32px;
}

.logo img {
  height: 36px;
  width: auto;
  filter: invert(1);
}

/* Tagline */
.tagline {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  text-align: center;
  max-width: 560px;
  line-height: 1.25;
  margin-bottom: 60px;
  color: #fff;
}

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  width: 100%;
  max-width: 1000px;
}

/* Card */
.card {
  background: #111;
  border-radius: 20px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
}

.card-thumb {
  aspect-ratio: 4/3;
  background: #2a2a2a;
  border-radius: 16px;
  margin: 10px;
  width: calc(100% - 20px);
  overflow: hidden;
  position: relative;
}

.card-thumb iframe {
  width: 200%;
  height: 200%;
  border: none;
  transform: scale(0.5);
  transform-origin: top left;
  pointer-events: none;
}

.card-info {
  padding: 12px 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.card-text {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.card-name {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-category {
  font-size: 12px;
  font-weight: 400;
  color: #666;
}

.card-btn {
  background: #7446dd;
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: 20px;
  white-space: nowrap;
  text-decoration: none;
  align-self: flex-start;
  transition: opacity 0.15s;
  display: inline-block;
}

.card-btn:hover { opacity: 0.85; }

/* Coming soon card */
.card.empty .card-thumb {
  background: #1a1a1a;
}

.card.empty .card-name {
  color: #444;
}

.card.empty .card-btn {
  background: #222;
  color: #555;
  pointer-events: none;
}

/* Footer */
footer {
  margin-top: 80px;
  text-align: center;
  color: #444;
  font-size: 14px;
  line-height: 1.8;
}
</style>
</head>
<body>

<div class="logo">
  <img src="logo.svg" alt="FXKits">
</div>

<p class="tagline">A library of AI-powered visual effect tools for designers.</p>

<div class="grid">

  <a class="card" href="Halftone Simulator/index.html">
    <div class="card-thumb"></div>
    <div class="card-info">
      <div class="card-text">
        <div class="card-name">Halftone Simulator</div>
        <div class="card-category">Visual Effect</div>
      </div>
      <span class="card-btn">Access</span>
    </div>
  </a>

  <div class="card empty">
    <div class="card-thumb"></div>
    <div class="card-info">
      <div class="card-text">
        <div class="card-name">Coming Soon</div>
        <div class="card-category">Visual Effect</div>
      </div>
      <span class="card-btn">Soon</span>
    </div>
  </div>

  <div class="card empty">
    <div class="card-thumb"></div>
    <div class="card-info">
      <div class="card-text">
        <div class="card-name">Coming Soon</div>
        <div class="card-category">Visual Effect</div>
      </div>
      <span class="card-btn">Soon</span>
    </div>
  </div>

  <div class="card empty">
    <div class="card-thumb"></div>
    <div class="card-info">
      <div class="card-text">
        <div class="card-name">Coming Soon</div>
        <div class="card-category">Visual Effect</div>
      </div>
      <span class="card-btn">Soon</span>
    </div>
  </div>

</div>

<footer>
  <p>Vibe Coded by Zak</p>
  <p>fxkits.io</p>
</footer>

</body>
</html>
